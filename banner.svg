<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" role="img" aria-labelledby="title desc">
<title id="title">Open Bible in warm morning light</title><desc id="desc">An open Bible rests on a wooden table beside a glowing lantern, with soft ivory and sage tones.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0e3"/><stop offset=".5" stop-color="#e8d6b7"/><stop offset="1" stop-color="#b8b79a"/></linearGradient>
 <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9b7854"/><stop offset="1" stop-color="#654735"/></linearGradient>
 <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e5d5b8"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff9dc" stop-opacity=".95"/><stop offset="1" stop-color="#e6bd6c" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#795b36"/><stop offset=".5" stop-color="#f7d991"/><stop offset="1" stop-color="#694b2d"/></linearGradient>
</defs>
<rect width="1920" height="600" fill="url(#wall)"/><circle cx="1450" cy="130" r="360" fill="url(#sun)"/>
<path d="M0 430 Q380 405 750 438 T1450 420 T1920 435 V600 H0Z" fill="url(#table)"/>
<g opacity=".2" stroke="#f0d5a6" stroke-width="4"><path d="M0 470 Q500 445 980 474 T1920 462"/><path d="M0 530 Q460 510 1000 540 T1920 520"/></g>
